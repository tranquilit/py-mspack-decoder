[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "py-mspack-decoder"
version = "0.1.2"
description = "Pure-Python Microsoft Kerberos PAC decoder"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Simon Fonteneau" }]
dependencies = []

[project.optional-dependencies]
gssapi = ["gssapi>=1.8"]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/tranquilit/py-mspack-decoder"
Repository = "https://github.com/tranquilit/py-mspack-decoder"
Issues = "https://github.com/tranquilit/py-mspack-decoder/issues"
